_schema-version: 3.3.0
ID: incident-feedback-service
version: 1.0.0
description: "CAP microservice for incident feedback and ratings"
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: incident-feedback-service-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    properties:
      SAP_CALM_FESR_LOG_LEVEL: info
      SAP_CALM_DCI_LOG_LEVEL: info
      SAP_CALM_SERVICE_NAME: incident-feedback-srv
      SAP_CALM_SERVICE_TYPE: SAP_CP_CF
      SAP_CALM_DCI_AGG_THRESHOLD: 10
      OTEL_RESOURCE_ATTRIBUTES: sap.tenancy.tenant_id=52fbaf37-c604-4abf-8580-c97703835dc8
      NODE_ARGS: -r @sap/xotel-agent-ext-js
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: incident-feedback-service-db
      - name: incident-management-xsuaa-service
      # - name: xp265-cl
      - name: cls-logging-drain
      - name: xp265-auto
      - name: incident-feedback-service-destination

  - name: incident-feedback-service-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: incident-feedback-service-db

  - name: incident-feedback-service-app-deployer
    type: com.sap.application.content
    path: gen
    requires:
      - name: incident-management-xsuaa-service
      - name: srv-api
      - name: incident-feedback-service-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    build-parameters:
      build-result: app/
      requires:
        - name: incidentfeedbackservicefeedback
          artifacts:
            - feedback.zip
          target-path: app/
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: srv-api
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true
              - Name: ui5
                URL: https://ui5.sap.com
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet

  - name: incidentfeedbackservicefeedback
    type: html5
    path: app/feedback
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: incident-feedback-service-destinations
    type: com.sap.application.content
    requires:
      - name: incident-management-xsuaa-service
        parameters:
          service-key:
            name: incident-management-xsuaa-service-key
      - name: incident-feedback-service-html5-repo-host
        parameters:
          service-key:
            name: incident-feedback-service-html5-repo-host-key
      - name: srv-api
      - name: incident-feedback-service-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: incident-feedback-service-html5-repository
              ServiceInstanceName: incident-feedback-service-html5-repo-host
              ServiceKeyName: incident-feedback-service-html5-repo-host-key
              sap.cloud.service: incidentfeedbackservice.service
            - Name: incident-management-xsuaa-service
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: incident-management-xsuaa-service
              ServiceKeyName: incident-management-xsuaa-service-key
              sap.cloud.service: incidentfeedbackservice.service

resources:
  - name: incident-feedback-service-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: incident-management-xsuaa-service
    type: org.cloudfoundry.existing-service
  # Cloud Logging instance      
  - name: xp265-cl
    type: org.cloudfoundry.existing-service
  # Auto Scaler instance
  - name: xp265-auto
    type: org.cloudfoundry.existing-service
  - name: incident-feedback-service-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: srv-api
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true

  - name: incident-feedback-service-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: incident-feedback-service-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  - name: cls-logging-drain
    type: org.cloudfoundry.existing-service
    parameters:
      service-tags: ["cloud-logging", "Cloud Logging"]